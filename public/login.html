<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統登入 - LTMS 管理系統</title>
  
  <!-- Link to global static styles -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <style>
    /* Dedicated Layout Styles for Login Container */
    body.login-page {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .login-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-size: 1.5rem;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #64748b;
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #334155;
    }

    .form-control {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.875rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: #2563eb;
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .alert-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <h1>LTMS 管理系統</h1>
      <p>請輸入帳號密碼以登入系統</p>
    </div>

    <!-- Dynamic Error Alert Box (Controlled by login.js) -->
    <div id="error-alert" class="alert-error"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="username">使用者帳號</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          placeholder="請輸入帳號" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">密碼</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="請輸入密碼" 
          required
        >
      </div>

      <button type="submit" class="btn-submit">登入</button>
    </form>
  </div>

  <!-- Link External Client-Side Login Controller -->
  <script src="/js/login.js"></script>

</body>
</html>
